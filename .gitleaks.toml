title = "Cline SDK secret scanning"

[extend]
useDefault = true

# ACT IDs from ACT-CLINEMM-COMPACTION-TOKEN-RESCALING-CONSUMER-REPAIR01
# (and other similar Factory recon/repair ACT IDs) are caught by the
# default generic-api-key rule because of their hyphenated uppercase
# entropy. They are not secrets — they are durable Factory ACT
# identifiers used to bind entry-freeze.txt + evidence to the
# producing ACT. Allowlisted here so the pre-commit gate does not
# block legitimate recon/repair ACT body + entry-freeze files.
[[allowlists]]
description = "Factory ACT identifiers (recon/repair ACT IDs)"
targetRules = ["generic-api-key"]
regexes = [
  '''ACT-CLINEMM-(COMPACTION-TOKEN-RESCALING-CONSUMER|RUNTIME-EPOCH-TRANSITION-ACTIVE-TURNSTATE|RUNTIME-TASK-HEADER-PROJECTION-COHERENCE|COMPACTION-INPUT-IDENTITY|COMPACTION-WIRE-CONTRACT|COMPACTION-TOKEN-ACCOUNTING)[A-Z0-9-]*''',
]
paths = [
  '''\.factory/acts/.*\.md$''',
  '''\.factory/evidence/.*\.txt$''',
  '''\.factory/epics/.*\.md$''',
  '''\.factory/epic-board\.md$''',
]

# Safe-YOLO / seatbelt sandbox qualification canaries. The harness
# scripts under .factory/evidence/ACT-CLINEMM-SAFE-YOLO-SEATBELT-*
# generate two kinds of synthetic markers that trip the generic-api-key
# rule but are NOT credentials:
#
#   1. The "GREEN-<12-hex>" canary token used by the network-open
#      qualification test (see green-postchange.json files). The token
#      is generated locally by the harness, used as an HTTP probe
#      marker, and is never transmitted to any external service.
#      Source: scripts under the same ACT directory confirm the
#      harness writes `"GREEN-" + randomBytes(6).toString("hex")`.
#
#   2. The `canarySecretSha` / `canarySentinelSha` / `canaryNestedSha`
#      fields in yq-evidence.json. These are SHA-256 digests of
#      synthetic sentinel files (literal content `SYNTHETIC_SECRET`,
#      `HOME_SENTINEL`, `NESTED_SENTINEL`) used to verify the
#      production seatbelt sandbox correctly denies file mutation
#      across the home-root boundary. They are hash outputs, not
#      credentials; they are not reusable as auth tokens.
#
# Allowlisted under .factory/evidence/ACT-CLINEMM-SAFE-YOLO-SEATBELT-*
# so the pre-commit gate does not block legitimate safe-YOLO
# qualification evidence. Confirmed not-real-secrets via source review
# of capture-yq-evidence.ts (line 26: `"SYNTHETIC_SECRET\n"`) and
# green-postchange.json harness scripts in the same ACT dirs.
[[allowlists]]
description = "Safe-YOLO / seatbelt sandbox qualification canaries (synthetic test markers, not credentials)"
targetRules = ["generic-api-key"]
regexes = [
  '''"TOKEN"\s*:\s*"GREEN-[a-f0-9]+"''',
  '''"canarySecretSha"\s*:\s*"[a-f0-9]{64}"''',
  '''"canarySentinelSha"\s*:\s*"[a-f0-9]{64}"''',
  '''"canaryNestedSha"\s*:\s*"[a-f0-9]{64}"''',
]
paths = [
  '''\.factory/evidence/ACT-CLINEMM-SAFE-YOLO-SEATBELT-.*\.json$''',
]

# ACT-CLINEMM-COMMANDJOB-DESCENDANT-CONSERVATION-TELEMETRY01 helper-disc
# capture JSONs contain synthetic `client_token` and `job_token` fields
# that are test-fixture sentinel values generated locally by the harness
# (MD5-like 32-hex strings). They are NOT credentials — they are bound
# to the recorded fixturePath and were never transmitted to any external
# service. Allowlisted so the pre-commit gate does not block legitimate
# evidence files for this bounded ACT.
[[allowlists]]
description = "ACT-CLINEMM-COMMANDJOB-DESCENDANT-CONSERVATION-TELEMETRY01 helper-disc capture fixture tokens"
targetRules = ["generic-api-key"]
regexes = [
  '''"client_token"\s*:\s*"[a-f0-9]{32}"''',
  '''"job_token"\s*:\s*"[a-f0-9]{32}"''',
]
paths = [
  '''\.factory/evidence/ACT-CLINEMM-COMMANDJOB-DESCENDANT-CONSERVATION-TELEMETRY01/.*\.json$''',
]

# ACT-CLINEMM-HELPER-SUPERVISED-COMMAND-CONTAINMENT01 helper-disc
# capture JSONs contain synthetic `client_token` and `job_token`
# fields that are test-fixture sentinel values generated locally
# by the harness (32-hex strings from the C helper's gen_token()).
# They are NOT credentials — they are bound to the recorded
# fixturePath and were never transmitted to any external service.
# Allowlisted so the pre-commit gate does not block legitimate
# evidence files for this bounded ACT.
[[allowlists]]
description = "ACT-CLINEMM-HELPER-SUPERVISED-COMMAND-CONTAINMENT01 helper-disc capture fixture tokens"
targetRules = ["generic-api-key"]
regexes = [
  '''"client_token"\s*:\s*"[a-f0-9]{32}"''',
  '''"job_token"\s*:\s*"[a-f0-9]{32}"''',
]
paths = [
  '''\.factory/evidence/ACT-CLINEMM-HELPER-SUPERVISED-COMMAND-CONTAINMENT01/.*\.json$''',
]

# ACT-CLINEMM-EXTENSION-HOST-NATIVE-TRAP-SYMBOLIZATION01 evidence
# contains a frozen Apple .ips crash report. macOS crash reports
# include a `crashReporterKey` field — a per-install anonymous UUID
# generated on first launch by the host application (VSCodium in
# this case) and used solely to deduplicate upstream crash
# submissions. It is NOT a credential: it has no network service
# bound to it from the crash reporter, it is not transmitted by the
# chain under examination, and it grants no authority to a remote
# party. It is reported as "legacy unique id identifying a logical
# installation of an application" in Apple's documentation and is
# regenerated when the host application's data dir is reset.
# Allowlisted to follow the established ACT-specific scoped pattern
# so the pre-commit gate does not block legitimate forensic
# evidence preservation.
[[allowlists]]
description = "ACT-CLINEMM-EXTENSION-HOST-NATIVE-TRAP-SYMBOLIZATION01 frozen .ips crash-reporter installation UUID (anonymous per-install marker, not a credential)"
targetRules = ["generic-api-key"]
regexes = [
  '''"crashReporterKey"\s*:\s*"[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}"''',
]
paths = [
  '''\.factory/evidence/ACT-CLINEMM-EXTENSION-HOST-NATIVE-TRAP-SYMBOLIZATION01/.*\.ips$''',
]
